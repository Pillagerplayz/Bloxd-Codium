<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloxd Codium: Bloxd Code Editor v1.0</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
    <div id="app">
        <div class="top-bar">
            <p id="app-title">Bloxd Codium v1.0</p>
            <div class="window-controls">
                <button id="min-btn" title="Minimize"><i class="fas fa-minus"></i></button>
                <button id="max-btn" title="Maximize"><i class="fas fa-window-maximize"></i></button>
                <button id="close-btn" title="Close"><i class="fas fa-xmark"></i></button>
            </div>
        </div>
        <div class="header">
            <img class="logo" src="../assets/logo.png" alt="Bloxd Codium Logo" />
            <div class="dropdown">
                <button class="dropbtn">Project</button>
                <div class="dropdown-content">
                    <a href="#" id="new-project">New Project</a>
                    <a href="#" id="open-project">Open Project</a>
                    <a href="#" id="save-project">Save Project</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn">Edit</button>
                <div class="dropdown-content">
                    <a href="#" id="undo">Undo</a>
                    <a href="#" id="redo">Redo</a>
                    <a href="#" id="find">Find</a>
                    <a href="#" id="replace">Replace</a>
                </div>
            </div>
        </div>
        <div id="loading-screen" class="loading-screen">
            <img class="logo-large" src="../assets/logo.png" alt="Bloxd Codium Logo" />
            <div class="spinner"></div>
            <h3>Loading Bloxd Codium...</h3>
        </div>
        <div class="container">
            <div id="sidebar" class="sidebar">
                <div id="btn-sidebar" class="btn-sidebar">
                    <a href="#" id="btn-files" class="active" title="File Explorer" data-target="#file-explorer"><i class="fas fa-folder"></i></a>
                    <a href="#" id="btn-editor-tool" title="Editor Tools" data-target="#editor-tool"><i class="fas fa-toolbox"></i></a>
                    <a href="#" id="btn-build" title="Build" data-target="#build"><i class="fas fa-hammer"></i></a>
                    <a href="#" id="btn-console" title="Console" data-target="#console"><i class="fas fa-terminal"></i></a>
                    <a href="#" id="btn-emulator" title="Bloxd Emulator" data-target="#emulator"><i class="fas fa-gamepad"></i></a>
                    <a href="#" id="btn-publish" title="Deploy" data-target="#publish"><i class="fas fa-rocket"></i></a>
                </div>
                <div id="sb-content" class="sb-content">
                    <div id="file-explorer" class="file-explorer">
                        <div class="explorer-header">
                            <h4>File Explorer</h4>
                            <a href="#" id="explorer-options"><i class="fas fa-ellipsis"></i></a>
                        </div>
                    </div>
                    <div id="editor-tool" class="editor-tool" style="display: none;">
                        <div class="tool-header">
                            <h4>Editor Tools</h4>
                        </div>
                    </div>
                </div>
            </div>
            <div id="splitter" class="splitter" aria-hidden="true"></div>
            <div id="editor" class="code-editor"></div>
        </div>
    </div>

    <script src="../src/scripts/editor.js"></script>
</body>
</html>
